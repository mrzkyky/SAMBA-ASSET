<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded hexagon container -->
  <rect width="512" height="512" rx="128" fill="url(#darkBg)"/>
  
  <!-- Outer Neon Hexagon Border -->
  <path d="M256 40 L440 145 L440 367 L256 472 L72 367 L72 145 Z" 
        stroke="url(#neonGrad)" stroke-width="18" stroke-linejoin="round" filter="url(#neonGlow)"/>
  
  <!-- Stylized 3D S Icon -->
  <path d="M350 160 C350 160 320 130 260 130 C190 130 160 170 160 210 C160 270 240 280 290 300 C340 320 355 350 355 390 C355 450 300 480 240 480 C170 480 140 440 140 440" 
        stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Server Node Stack (Left) -->
  <rect x="95" y="270" width="55" height="18" rx="5" fill="#00f2fe" filter="url(#neonGlow)"/>
  <rect x="95" y="300" width="55" height="18" rx="5" fill="#00f2fe" filter="url(#neonGlow)"/>
  <rect x="95" y="330" width="55" height="18" rx="5" fill="#00f2fe" filter="url(#neonGlow)"/>
  
  <!-- Asset Cube (Right) -->
  <path d="M370 290 L415 265 L460 290 L415 315 Z" fill="#00f2fe" opacity="0.8"/>
  <path d="M370 290 L415 315 L415 365 L370 340 Z" fill="#00d2fe" opacity="0.9"/>
  <path d="M460 290 L415 315 L415 365 L460 340 Z" fill="#00a2fe"/>
</svg>
